# Extends the configuration for development (inits and mounting directory into core)
services:
  postgresinit:
    image: postgres
    depends_on:
      - postgres
    volumes:
      - .:/usr/src
    container_name: odota-postgresinit
    entrypoint:
      [
        "bash",
        "-c",
        "sleep 10 && psql --file /usr/src/sql/init.sql postgres://postgres:postgres@odota-postgres/postgres && psql --file /usr/src/sql/create_tables.sql postgres://postgres:postgres@odota-postgres/yasp",
      ]
  cassandrainit:
    image: cassandra
    depends_on:
      - cassandra
    volumes:
      - .:/usr/src
    container_name: odota-cassandrainit
    entrypoint:
      [
        "bash",
        "-c",
        "sleep 45 && cqlsh -f /usr/src/sql/init.cql odota-cassandra && cqlsh -f /usr/src/sql/create_tables.cql -k yasp odota-cassandra",
      ]
  rustfsinit:
    image: rustfs/rc:latest
    depends_on:
      - rustfs
    container_name: odota-rustfsinit
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      rc alias set rustfs http://odota-rustfs:9000 rustfsadmin rustfsadmin;
      rc bucket create rustfs/opendota-blobs;
      rc bucket create rustfs/opendota;
      rc bucket create rustfs/opendota-players;
      exit 0;
      "
  core:
    volumes:
      - .:/usr/src
      - /usr/src/node_modules
