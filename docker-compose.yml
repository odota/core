services:
  postgres:
    image: postgres:9.5
    container_name: odota-postgres
    environment:
      POSTGRES_PASSWORD: postgres
  cassandra:
    image: cassandra:5.0
    container_name: odota-cassandra
    environment:
      JVM_EXTRA_OPTS: -Dcassandra.skip_wait_for_gossip_to_settle=0
  clickhouse:
    image: clickhouse/clickhouse-server:26.10
    container_name: odota-clickhouse
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
  rustfs:
    image: rustfs/rustfs:latest
    container_name: odota-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
  parser:
    image: odota/parser
    container_name: odota-parser
  core:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "5100:5100"
    environment:
      PARSER_HOST: odota-parser:5600
      POSTGRES_URL: postgresql://postgres:postgres@odota-postgres/yasp
      READONLY_POSTGRES_URL: postgresql://readonly:readonly@odota-postgres/yasp
      CASSANDRA_URL: cassandra://odota-cassandra/yasp
      CLICKHOUSE_URL: http://odota-clickhouse:8123/yasp
      ARCHIVE_S3_ENDPOINT: http://odota-rustfs:9000
    links:
      - postgres
      - parser
      - rustfs
      - cassandra
      - clickhouse
    container_name: odota-core
